<script>

let count=1;
let price=578;


function increment(){
count ++;
document.getElementById("count").innerHTML=count;
document.getElementById("price").innerHTML=count*price;

}
function decrement(){

document.getElementById("count").innerHTML=count;
document.getElementById("price").innerHTML=count*price;
if(count >1){
count --;
}
}

</script>

<html>
<head>
<title>Booksky</title>
</head>
<body>

<nav>
<h1>Booksky</h1>
</nav>

<div class="container">
<div class="container-book">
<h1>Mythily</h1>
<h3>comedy book</h3>
<p>click pannupothu antha event nadakka event handler use pannanum.
click pannupothu antha event nadakka event handler use pannanum.
click pannupothu antha event nadakka event handler use pannanum.
click pannupothu antha event nadakka event handler use pannanum.</p> <br>
<button onclick="deleteitem(event)">Delete</button>
</div>
</div>

<button class="add-button" id="add-popup-button" onclick="showpopup()">+</button>

<div class="overlay"></div>
<div class="popupbox">

<input type="text" placeholder="Bookname" id="book-name-input"><br><br>
<input type="text" placeholder="author" id="author-name-input"> <br><br>
<textarea placeholder="Description" id="description-input"></textarea> <br><br>
<button id="add-book" onclick="addpopup()">Add</button>
<button id="cancel-popup" onclick="cancelpopup()" >Cancel</button>

</div>

</body>
</html>

<style>

*{
margin:0;
padding:0;
}

nav{
background-color:red;
padding:15px;
}

.container-book{
border:2px solid;
width:25%;
margin:30px;
padding:20px;
background-color:black;
color:white;
border-radius:20px;
border:none;
display:inline-block;
vertical-align:top;

}
.container-book h1{
padding-bottom:10px;
color:red;
}

.container-book h3{
padding-bottom:10px;
color:yellow;

}

button{
padding:5px;
background-color:red;
color:white;
border:none;
border-radius:5px;
}
p{
text-align:justify;
}
.add-button{
  background-color:red;
  color:black;
  border-radius:100%;
  padding-top:20px;
  padding-bottom:20px;
  padding-right:30px;
  padding-left:30px;
  border:none;
  position:fixed;
  bottom:30px;
  font-size:30px;
  right:30px;
}

.overlay{
background-color:black;
position:absolute;
top:0;
right:0;
width:100%;
height:100%;
opacity:0.8;
z-index:1;
display:none;
}

.popupbox{

position:absolute;
width:400px;
padding:40px;
background-color:red;
border-radius:10px;
top:20%;
left:30%;
z-index:2;
padding:30px;
display:none;

}

.popupbox input{
padding:10px;
width:100%;
background:transparent;
border:none;
font-size:20px;
border-bottom:2px solid black;

}

.popupbox textarea{
padding:10px;
width:100%;
background:transparent;
border:none;
font-size:20px;
border:2px solid black;

}
.popupbox input::placeholder{
color:black;
}

textarea::placeholder{
color:black;
}
.popupbox button{
background-color:black;
color:white;
padding:10px;
width:80px;
border:none;
border-radius:5px;
}

.popupbox input:focus{
outline:none;
}
.popupbox textarea:focus{
outline:none;
}
</style>

<script>

var popupoverlay=document.querySelector(".overlay")
var popupbox=document.querySelector(".popupbox")
var addpopupbutton= document.getElementById("add-popup-button")

function showpopup(){

popupoverlay.style.display="block";
popupbox.style.display="block";
}

function cancelpopup(){
popupoverlay.style.display="none";
popupbox.style.display="none";
}

var container=document.querySelector(".container")
var addbook=document.getElementById("add-book")
var booknameinput=document.getElementById("book-name-input")
var authornameinput=document.getElementById("author-name-input")
var descriptioninput=document.getElementById("description-input")

function addpopup(){

var div=document.createElement("div")
div.setAttribute("class","container-book")
div.innerHTML=`<h1>${booknameinput.value}</h1>
<h3>${authornameinput.value}</h3>
<p>${descriptioninput.value}</p> <br>
<button onclick="deleteitem(event)">Delete</button>`
container.append(div)

popupoverlay.style.display="none";
popupbox.style.display="none";

}

function deleteitem(event){

event.target.parentElement.remove()
}

</script>
